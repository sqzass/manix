name: release

on:
  push:
    branches: [nightly, main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for manual release'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            bump="${MANUAL_BUMP:-patch}"
            echo "Manual release: bump=${bump}"
          else
            subject="${COMMIT_MESSAGE%%$'\\n'*}"
            subject="${subject,,}"

            if [[ "$subject" =~ ^(major|minor|patch):[[:space:]]* ]]; then
              bump="${BASH_REMATCH[1]}"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Commit message must start with major:, minor:, or patch:. Skipping release."
              exit 0
            fi
          fi

          latest_version_tag="$(
            git tag --list 'v[0-9]*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\.[0-9]+)?$' |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -z "$latest_version_tag" ]]; then
            major=0
            minor=0
            patch=0
          else
            base_version="${latest_version_tag#v}"
            base_version="${base_version%%-*}"
            IFS=. read -r major minor patch <<< "$base_version"
          fi

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          base_version="${major}.${minor}.${patch}"

          if [[ "$BRANCH_NAME" == "nightly" ]]; then
            version="v${base_version}-nightly.${RUN_NUMBER}"
            prerelease=true
          else
            version="v${base_version}"
            prerelease=false
          fi

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Release tag ${version} already exists."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Preparing ${version}"

      - name: Set up Node
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set manifest version
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const tag = process.env.RELEASE_VERSION;
          const match = tag.match(/^v(\d+\.\d+\.\d+)(?:-nightly\.(\d+))?$/);

          if (!match) {
            throw new Error(`Unsupported release version: ${tag}`);
          }

          const manifestPath = "extension/manifest.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));

          manifest.version = match[2] ? `${match[1]}.${match[2]}` : match[1];

          fs.writeFileSync(
            manifestPath,
            `${JSON.stringify(manifest, null, 4)}\n`
          );

          console.log(`Set manifest version to ${manifest.version}`);
          NODE

      - name: Commit manifest version
        id: manifest
        if: steps.version.outputs.should_release == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add extension/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update manifest version [skip ci]"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Chrome
        if: steps.version.outputs.should_release == 'true'
        uses: browser-actions/setup-chrome@v1

      - name: Package signed CRX
        if: steps.version.outputs.should_release == 'true'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CRX_PRIVATE_KEY" ]]; then
            echo "CRX_PRIVATE_KEY secret is not set."
            exit 1
          fi

          key_file="$RUNNER_TEMP/extension.pem"
          package_dir="$RUNNER_TEMP/extension"
          trap 'rm -f "$key_file"' EXIT

          printf '%s\n' "$CRX_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          cp -R extension "$package_dir"

          chrome --no-sandbox \
            --pack-extension="$package_dir" \
            --pack-extension-key="$key_file"

          crx_file="${package_dir}.crx"
          if [[ ! -f "$crx_file" ]]; then
            echo "Chrome did not create the expected CRX file: $crx_file"
            exit 1
          fi

          mv "$crx_file" "$GITHUB_WORKSPACE/extension-${{ steps.version.outputs.version }}.crx"

      - name: Create GitHub Release and upload CRX
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.manifest.outputs.commit }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: extension-*.crx
