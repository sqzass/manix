# Push to nightly (Lumen) → promotes to stable (Manix)
# Each promotion runs scripts/brands.js so the tree is rebranded
# PRs are created manually from the GitHub website

name: promote

on:
  push:
    branches: [nightly]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose promotion branch (nightly → main)
        if: github.event_name == 'push'
        run: |
          git config user.name "manix-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          HEAD="promote/nightly-to-main"
          git checkout -B "$HEAD" "origin/main"

          # Merge nightly into main, nightly is source of truth
          git merge -X theirs --no-ff --no-edit "origin/nightly"

          node scripts/brands.js "main"
          git add -A
          git diff --cached --quiet || git commit -m "chore(release): rebrand for main"

          git push --force origin "$HEAD"