name: ci

on:
  push:
    branches: [nightly, beta, main]
  pull_request:
    branches: [nightly, beta, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

