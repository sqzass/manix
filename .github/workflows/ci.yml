name: ci

on:
  push:
    branches: [ nightly, beta, main ]
  pull_request:
    branches: [ nightly, beta, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint