name: ci

on:
  push:
    branches: [nightly, beta, main]
  pull_request:
    branches: [nightly, beta, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  release:
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          subject="${COMMIT_MESSAGE%%$'\n'*}"
          subject="${subject,,}"

          if [[ "$subject" =~ ^(major|minor|patch):[[:space:]]* ]]; then
            bump="${BASH_REMATCH[1]}"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Commit message must start with major:, minor:, or patch:. Skipping release."
            exit 0
          fi

          latest_stable_tag="$(
            git tag --list 'v[0-9]*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -z "$latest_stable_tag" ]]; then
            major=0
            minor=0
            patch=0
          else
            IFS=. read -r major minor patch <<< "${latest_stable_tag#v}"
          fi

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          base_version="${major}.${minor}.${patch}"

          if [[ "$BRANCH_NAME" == "nightly" ]]; then
            version="v${base_version}-nightly.${RUN_NUMBER}"
            prerelease=true
          else
            version="v${base_version}"
            prerelease=false
          fi

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Release tag ${version} already exists."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Preparing ${version}"

      - name: Set up Chrome
        if: steps.version.outputs.should_release == 'true'
        uses: browser-actions/setup-chrome@v1

      - name: Package signed CRX
        if: steps.version.outputs.should_release == 'true'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$CRX_PRIVATE_KEY" ]]; then
            echo "CRX_PRIVATE_KEY secret is not set."
            exit 1
          fi

          key_file="$RUNNER_TEMP/extension.pem"
          package_dir="$RUNNER_TEMP/extension"
          trap 'rm -f "$key_file"' EXIT

          printf '%s\n' "$CRX_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          cp -R extension "$package_dir"

          chrome --no-sandbox \
           --pack-extension="$package_dir" \
            --pack-extension-key="$key_file"

          crx_file="${package_dir}.crx"
          if [[ ! -f "$crx_file" ]]; then
            echo "Chrome did not create the expected CRX file: $crx_file"
            exit 1
          fi

          mv "$crx_file" "$GITHUB_WORKSPACE/extension-${{ steps.version.outputs.version }}.crx"

      - name: Create GitHub Release and upload CRX
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: extension-*.crx