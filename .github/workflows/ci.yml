name: ci

on:
  push:
    branches: [nightly, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  build-crx:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build CRX
        run: npm run build

      - name: Tag CRX for branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/nightly" ]]; then
            artifact_name="extension-nightly-${GITHUB_SHA}"
          else
            artifact_name="extension-release-${GITHUB_SHA}"
          fi

          mv extension.crx "${artifact_name}.crx"
          echo "name=${artifact_name}" >> "$GITHUB_ENV"

      - name: Upload CRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: extension-*.crx